<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Market Trends | CropPilot</title>

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/market.css') }}">

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <div class="navbar">

        <a href="/" class="logo">
            🌱 CropPilot
        </a>

        <a href="/" class="home-btn">
            Home
        </a>

    </div>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <div class="container">

        <h1>
            📈 Market Trends & Best Selling Market
        </h1>

        <p class="subtitle">
            Analyze crop prices and identify the best mandi to sell your crop.
        </p>

        <!-- ========================= -->
        <!-- TOP GRID -->
        <!-- ========================= -->

        <div class="grid">

            <!-- SELECT CARD -->
            <div class="card">

                <h2>
                    🌾 Select Crop
                </h2>

                <label>
                    Crop Name
                </label>

                <select id="cropInput">

                    <option value="">
                        Select Crop
                    </option>

                    <option value="Potato">
                        Potato
                    </option>

                    <option value="Tomato">
                        Tomato
                    </option>

                    <option value="Rice">
                        Rice
                    </option>

                    <option value="Wheat">
                        Wheat
                    </option>

                    <option value="Onion">
                        Onion
                    </option>

                    <option value="Maize">
                        Maize
                    </option>

                    <option value="Soyabean">
                        Soyabean
                    </option>

                    <option value="Cotton">
                        Cotton
                    </option>

                </select>

                <div class="btn-group">

                    <button onclick="loadData()">
                        Analyze Market
                    </button>

                    <button class="reset"
                        onclick="resetData()">

                        Reset
                    </button>

                </div>

            </div>

            <!-- BEST MARKET -->
            <div class="card">

                <h2>
                    🏆 Best Market
                </h2>

                <div id="bestMarket">

                    Select crop to view
                    best selling market

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- TABLE -->
        <!-- ========================= -->

        <div class="card table-card">

            <h2>
                📋 Top Markets
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>Market</th>

                        <th>State</th>

                        <th>Crop</th>

                        <th>Price</th>

                    </tr>

                </thead>

                <tbody id="tableBody">

                    <tr>

                        <td colspan="4">

                            No market data available

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- ========================= -->
        <!-- CHART -->
        <!-- ========================= -->

        <div class="card">

            <h2>
                📊 Price Trend Analysis
            </h2>

            <canvas id="chart"></canvas>

        </div>

    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/market.js') }}"></script>

</body>

</html>
